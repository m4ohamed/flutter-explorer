name: Build Rust WASM & Extension Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Rust WASM & Linux MCP Server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: ⚡ Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: ⚙️ Build Rust Core to WebAssembly
        run: |
          cd rust-core
          wasm-pack build --target nodejs --out-dir ../out/wasm_pkg
          mkdir -p ../src/wasm_pkg
          cp -r ../out/wasm_pkg/* ../src/wasm_pkg/

      - name: 🚀 Upload Compiled WASM Core
        uses: actions/upload-artifact@v4
        with:
          name: flutter-explorer-wasm-pkg
          path: out/wasm_pkg/

      - name: 🦀 Build Standalone Native MCP Server (Linux)
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --bin flutter-explorer-mcp
          cp rust-core/target/release/flutter-explorer-mcp ./flutter-explorer-mcp-linux

      - name: 🚀 Upload Native Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: flutter-explorer-mcp-linux
          path: flutter-explorer-mcp-linux

  build-windows:
    name: Compile Windows MCP & Package Complete VSIX
    needs: build
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🔨 Build Native Windows MCP Server (.exe)
        run: |
          cargo build --release --manifest-path rust-core/Cargo.toml --bin flutter-explorer-mcp
          Copy-Item rust-core/target/release/flutter-explorer-mcp.exe ./flutter-explorer-mcp-windows.exe

      - name: 🚀 Upload Native Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-explorer-mcp-windows-exe
          path: flutter-explorer-mcp-windows.exe

      - name: 📥 Download WASM Core from Build Job
        uses: actions/download-artifact@v4
        with:
          name: flutter-explorer-wasm-pkg
          path: out/wasm_pkg

      - name: 📋 Copy WASM to src/wasm_pkg
        run: |
          New-Item -ItemType Directory -Force -Path src/wasm_pkg
          Copy-Item -Recurse out/wasm_pkg/* src/wasm_pkg/

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Install Dependencies (Native Windows sqlite3)
        run: npm install

      - name: 🔨 Compile Extension & MCP Server
        run: npm run compile

      - name: 🧪 Run Typecheck
        run: npm run typecheck

      - name: 📦 Package Complete Windows VSIX (No Missing Modules)
        run: npx vsce package

      - name: 🚀 Upload Complete Windows VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-explorer-vsix
          path: "*.vsix"
