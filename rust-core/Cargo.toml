[package]
name = "flutter_explorer_core"
version = "0.2.0"
edition = "2021"
description = "High-performance Rust WASM & Native MCP core for Flutter Explorer (code parsing, search & analysis)"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flutter-explorer-mcp"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false