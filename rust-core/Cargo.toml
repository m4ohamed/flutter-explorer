[package]
name = "flutter_explorer_core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust WASM core for Flutter Explorer (code parsing, search & analysis)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
