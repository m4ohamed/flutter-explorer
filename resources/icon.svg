<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">  
  <!-- Background -->  
  <rect width="128" height="128" rx="28" fill="#02569B"/>  
    
  <!-- Flutter Logo (simplified) -->  
  <g transform="translate(24, 24)">  
    <!-- Left wing -->  
    <path d="M0 80 L30 50 L30 20 L0 50 Z" fill="#40C4FF"/>  
    <!-- Right wing -->  
    <path d="M30 50 L60 20 L60 50 L30 80 Z" fill="#40C4FF"/>  
    <!-- Center -->  
    <path d="M30 20 L60 20 L30 50 Z" fill="#81D4FA"/>  
  </g>  
    
  <!-- Magnifying glass (Explorer) -->  
  <g transform="translate(60, 60)">  
    <circle cx="20" cy="20" r="16" fill="none" stroke="white" stroke-width="4"/>  
    <line x1="32" y1="32" x2="44" y2="44" stroke="white" stroke-width="4" stroke-linecap="round"/>  
  </g>  
</svg>